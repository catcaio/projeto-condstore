name: CI Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-qa:
    name: Typecheck, Build & QA
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify Schema Drift
        run: npm run db:verify

      - name: Build project
        run: npm run build

      - name: Start Server & Run QA Snapshots
        env:
          PORT: 3002
          BASE_URL: http://localhost:3002
          VERCEL_ENV: development
          INTERNAL_TOKEN: fake_workflow_token_99
          DATABASE_URL: mysql://root:root@localhost:3306/condstore_dev
          AUTH_SECRET: dev-secret-ci
        run: |
          npm run start -- -p 3002 &
          echo "Waiting for Next.js to start..."
          until curl -s http://localhost:3002/ > /dev/null; do
            sleep 2
          done
          echo "Server is up! Running QA Snapshots..."
          npm run qa:snapshots

      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-snapshots-artifacts
          path: .qa/artifacts
