name: CI Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    env:
      # Optional CI secrets (recommended):
      # - CI_AUTH_SECRET
      # - CI_DATABASE_URL
      # - CI_PII_ENCRYPTION_KEY (64 hex chars)
      # Fallbacks below are CI-only and never used by app runtime in production.
      AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET != '' && secrets.CI_AUTH_SECRET || '5d2c9b7d6571b070c0f8389c7d44ed3b8b7d6a4095d29646d09aa854f17caa6e' }}
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL != '' && secrets.CI_DATABASE_URL || 'mysql://ci_user:ci_password@127.0.0.1:3306/condstore_ci' }}
      PII_ENCRYPTION_KEY: ${{ secrets.CI_PII_ENCRYPTION_KEY != '' && secrets.CI_PII_ENCRYPTION_KEY || '6f2d2a4d8f9e6ab34b45d8b0d2e53c4a7b198d4f5566778899aabbccddeeff01' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Env Leak Check
        run: node scripts/check-env-leak.mjs

      - name: Critical Secrets Health Check
        run: npm run lint:secrets-critical

      - name: Verify Routes Guardrail
        run: npm run routes:sync

      - name: Verify Route Security Guards
        run: npm run routes:verify-security

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run coverage gate
        run: npm run test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          if-no-files-found: ignore
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/lcov-report

      - name: Build project
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Verify Schema Drift
        run: npm run db:verify

      - name: Guardrails Public API
        run: node --import tsx scripts/guardrails-public-api.ts

      - name: Verify clean worktree
        run: |
          git checkout -- next-env.d.ts || true
          if ! git diff --quiet; then
            echo "::error::Worktree is dirty after build. Unstaged changes detected."
            git diff --stat
            exit 1
          fi

      - name: Validate Required Secrets
        env:
          QA_BOOTSTRAP_TOKEN: ${{ secrets.QA_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$QA_BOOTSTRAP_TOKEN" ]; then
            echo "::error::Secret QA_BOOTSTRAP_TOKEN is not configured. Go to Settings → Secrets and variables → Actions and add QA_BOOTSTRAP_TOKEN."
            exit 1
          fi
          echo "QA_BOOTSTRAP_TOKEN is set."

      - name: Start Server & Run QA Snapshots
        env:
          PORT: 3002
          BASE_URL: http://localhost:3002
          VERCEL_ENV: development
          CI: "true"
          GITHUB_ACTIONS: "true"
          QA_BOOTSTRAP_TOKEN: ${{ secrets.QA_BOOTSTRAP_TOKEN }}
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL != '' && secrets.CI_DATABASE_URL || 'mysql://ci_user:ci_password@127.0.0.1:3306/condstore_ci' }}
          AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET != '' && secrets.CI_AUTH_SECRET || '5d2c9b7d6571b070c0f8389c7d44ed3b8b7d6a4095d29646d09aa854f17caa6e' }}
          PII_ENCRYPTION_KEY: ${{ secrets.CI_PII_ENCRYPTION_KEY != '' && secrets.CI_PII_ENCRYPTION_KEY || '6f2d2a4d8f9e6ab34b45d8b0d2e53c4a7b198d4f5566778899aabbccddeeff01' }}
        run: |
          npm run start -- -p 3002 &
          echo "Waiting for Next.js to start..."
          until curl -s http://localhost:3002/ > /dev/null; do
            sleep 2
          done
          echo "Server is up! Running QA Snapshots..."
          npm run qa:snapshots

      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-snapshots-artifacts
          path: .qa/artifacts
