name: CI Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Env Leak Check
        run: node scripts/check-env-leak.mjs

      - name: Verify Routes Guardrail
        run: |
          npm run routes:inventory
          npm run routes:verify

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Verify Schema Drift
        run: npm run db:verify

      - name: Guardrails Public API
        run: node --import tsx scripts/guardrails-public-api.ts

      - name: Build project
        run: npm run build

      - name: Verify clean worktree
        run: |
          if ! git diff --quiet; then
            echo "::error::Worktree is dirty after build. Unstaged changes detected."
            git diff --stat
            exit 1
          fi

      - name: Validate Required Secrets
        env:
          QA_BOOTSTRAP_TOKEN: ${{ secrets.QA_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$QA_BOOTSTRAP_TOKEN" ]; then
            echo "::error::Secret QA_BOOTSTRAP_TOKEN is not configured. Go to Settings → Secrets and variables → Actions and add QA_BOOTSTRAP_TOKEN."
            exit 1
          fi
          echo "QA_BOOTSTRAP_TOKEN is set."

      - name: Start Server & Run QA Snapshots
        env:
          PORT: 3002
          BASE_URL: http://localhost:3002
          VERCEL_ENV: development
          CI: "true"
          GITHUB_ACTIONS: "true"
          QA_BOOTSTRAP_TOKEN: ${{ secrets.QA_BOOTSTRAP_TOKEN }}
          DATABASE_URL: mysql://root:root@localhost:3306/condstore_dev
          AUTH_SECRET: dev-secret-ci
        run: |
          npm run start -- -p 3002 &
          echo "Waiting for Next.js to start..."
          until curl -s http://localhost:3002/ > /dev/null; do
            sleep 2
          done
          echo "Server is up! Running QA Snapshots..."
          npm run qa:snapshots

      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-snapshots-artifacts
          path: .qa/artifacts
