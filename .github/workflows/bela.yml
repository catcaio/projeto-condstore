name: BELA Architecture Sync

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bela-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-sync:
    name: Generate and sync architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Generate BELA ECD
        env:
          BELA_SOURCE: ${{ github.repository }}
        run: ./scripts/bela-update.sh

      - name: Upload generated ECD as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bela-update-ecd-${{ github.sha }}
          path: .bela/bela-update.ecd
          if-no-files-found: error
          retention-days: 7

      - name: Upload architecture to BELA
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          BELA_HOST: ${{ secrets.BELA_HOST }}
          BELA_API_TOKEN: ${{ secrets.BELA_API_TOKEN }}
        run: |
          if [ -z "${BELA_HOST}" ] || [ -z "${BELA_API_TOKEN}" ]; then
            echo "BELA_HOST e BELA_API_TOKEN não estão configurados; ECD gerado, upload ignorado."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 \
            "https://${BELA_HOST}/api/ecd-architecture" \
            -H "Authorization: Token ${BELA_API_TOKEN}" \
            --data-binary @.bela/bela-update.ecd
