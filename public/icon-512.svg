    <circle cx="232" cy="67" r="20" fill="#FFFFFF" opacity="0.95" />

    <!-- Bottom-Left: Pedidos e Rastreio -->
    <rect x="0" y="165" width="135" height="135" rx="38" fill="#F8F9FA" />

    <!-- Bottom-Right: Expedição e Logística -->
