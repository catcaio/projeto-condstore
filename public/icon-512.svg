<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="512" height="512">
  <!-- Superelipse Background Container -->
  <rect width="512" height="512" rx="128" fill="#0E1117" />

  <!-- Símbolo Institucional CONDSTORE OS (Módulos 2x2 com Espaço Negativo) -->
