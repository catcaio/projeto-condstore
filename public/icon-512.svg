    <!-- Top-Left: Atendimento / Recepção -->
    <rect x="0" y="0" width="135" height="135" rx="38" fill="#F8F9FA" />

    <!-- Top-Right: Núcleo de Cotação e Orquestração (Azul Elétrico) -->
