<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="320" height="64">
  <!-- Símbolo Primário (V1) -->
  <g transform="translate(4, 4)">
    <rect x="7" y="7" width="18" height="18" rx="5" fill="currentColor" opacity="0.95" />
    <rect x="31" y="7" width="18" height="18" rx="5" fill="#0077FF" />
    <circle cx="40" cy="16" r="2.5" fill="#FFFFFF" opacity="0.9" />
    <rect x="7" y="31" width="18" height="18" rx="5" fill="currentColor" opacity="0.95" />
    <rect x="31" y="31" width="18" height="18" rx="5" fill="currentColor" opacity="0.75" />
  </g>

  <!-- Assinatura Tipográfica -->
  <g transform="translate(74, 39)">
    <!-- CONDSTORE: Peso 700, tracking -0.01em -->
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="-0.01em" fill="currentColor">
      CONDSTORE
    </text>
    <!-- OS: Peso 500, tracking +0.05em, acento azul elétrico -->
    <text x="146" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="500" font-size="22" letter-spacing="0.05em" fill="#0077FF">
      OS
    </text>
  </g>

  <!-- Subtítulo de Posicionamento -->
  <text x="74" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="8" letter-spacing="0.14em" fill="currentColor" opacity="0.5">
    UM COMPLEXO SEM COMPLEXIDADE
  </text>
</svg>
