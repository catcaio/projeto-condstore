<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100" height="100">
  <!-- Tri-nó Operacional: 3 Módulos em superelipse orbitando núcleo de integração -->
  <!-- Top Node -->
  <rect x="35" y="12" width="30" height="30" rx="8" fill="#0077FF" />
  <!-- Bottom Left Node -->
  <rect x="15" y="52" width="30" height="30" rx="8" fill="currentColor" opacity="0.9" />
  <!-- Bottom Right Node -->
  <rect x="55" y="52" width="30" height="30" rx="8" fill="currentColor" opacity="0.8" />
  <!-- Central Negative Void & Core Node -->
  <circle cx="50" cy="52" r="5" fill="currentColor" opacity="0.4" />
</svg>
