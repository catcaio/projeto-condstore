<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" width="32" height="32">
  <style>
    :root {
      --fav-base: #0E1117;
      --fav-accent: #0077FF;
      --fav-dot: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fav-base: #F8F9FA;
        --fav-accent: #3395FF;
        --fav-dot: #0E1117;
      }
    }
    .base { fill: var(--fav-base); }
    .accent { fill: var(--fav-accent); }
    .dot { fill: var(--fav-dot); }
  </style>
  <!-- Módulos 2x2 com espessuras compensadas para 16px e 32px -->
  <rect class="base" x="4" y="4" width="10" height="10" rx="3" />
  <rect class="accent" x="18" y="4" width="10" height="10" rx="3" />
  <circle class="dot" cx="23" cy="9" r="1.5" />
  <rect class="base" x="4" y="18" width="10" height="10" rx="3" />
  <rect class="base" x="18" y="18" width="10" height="10" rx="3" opacity="0.85" />
</svg>
