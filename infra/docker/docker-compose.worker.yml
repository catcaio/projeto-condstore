# docker-compose.worker.yml
# ─────────────────────────────────────────────────────────────────────────────
# Sobe apenas o FinOps Worker (sem Next.js app).
# Uso: docker compose -f docker-compose.worker.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  finops-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    image: condstore/finops-worker:latest
    container_name: condstore-finops-worker
    restart: always

    # Variáveis de ambiente — prefira um .env file ou secrets manager em prod
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      SEED_TOKEN: ${SEED_TOKEN}
      # Opcional
      PROVIDER_SECRETS_KEY: ${PROVIDER_SECRETS_KEY:-}

    # Logging com rotação automática
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # Limites de recursos
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M

    # Healthcheck: processo vivo
    healthcheck:
      test: ["CMD", "pgrep", "-f", "finops-worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
